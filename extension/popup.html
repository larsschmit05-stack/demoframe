<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: white;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 10px 12px;
      background: #161922;
      border-radius: 8px;
      border: 1px solid #2a2d3a;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.idle {
      background: #6b7280;
    }

    .status-dot.recording {
      background: #ef4444;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-dot.paused {
      background: #f59e0b;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 13px;
      color: #9ca3af;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: -0.2px;
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      cursor: not-allowed;
      filter: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .btn-warning {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }

    .btn-danger {
      background: #1e1e2a;
      color: #ef4444;
      border: 1px solid #3a2030;
    }

    .btn-danger:hover {
      background: #2a1525;
    }

    .btn-export {
      background: #161922;
      color: #6366f1;
      border: 1px solid #2a2d3a;
      display: none;
    }

    .btn-export:hover {
      background: #1c1f2e;
    }

    .stats {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      padding: 8px 0;
      font-variant-numeric: tabular-nums;
    }

    .error {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      background: #1e1520;
      border: 1px solid #3a2030;
      border-radius: 8px;
      font-size: 12px;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">D</div>
    <h1>Demoframe</h1>
  </div>

  <div class="status-bar">
    <div id="status-dot" class="status-dot idle"></div>
    <span id="status-text" class="status-text">Ready</span>
  </div>

  <div class="controls">
    <button id="primary-btn" class="btn btn-primary">Start Recording</button>
    <button id="stop-btn" class="btn btn-danger" disabled style="opacity: 0.4">Stop &amp; Save</button>
    <button id="export-btn" class="btn btn-export">Export JSON</button>
  </div>

  <div id="stats" class="stats">Events: 0 | Elements: 0</div>

  <div id="error" class="error"></div>

  <script src="popup.js" type="module"></script>
</body>
</html>
