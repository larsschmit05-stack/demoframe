<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: white;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 10px 12px;
      background: #161922;
      border-radius: 8px;
      border: 1px solid #2a2d3a;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.idle { background: #6b7280; }
    .status-dot.capturing { background: #6366f1; animation: pulse 1s ease-in-out infinite; }
    .status-dot.ready { background: #22c55e; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 13px;
      color: #9ca3af;
    }

    /* Demo name input */
    .demo-name-input {
      width: 100%;
      padding: 8px 12px;
      background: #161922;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      color: #e1e4e8;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }

    .demo-name-input:focus {
      border-color: #6366f1;
    }

    .demo-name-input::placeholder {
      color: #4b5563;
    }

    /* Screen list */
    .screens-list {
      margin-bottom: 12px;
    }

    .screens-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .screen-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #161922;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .screen-item .screen-info {
      flex: 1;
      min-width: 0;
    }

    .screen-item .screen-name {
      color: #e1e4e8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .screen-item .screen-meta {
      color: #6b7280;
      font-size: 10px;
    }

    .screen-item .screen-remove {
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 14px;
      line-height: 1;
    }

    .screen-item .screen-remove:hover {
      color: #ef4444;
    }

    .empty-state {
      text-align: center;
      padding: 16px 0;
      color: #4b5563;
      font-size: 12px;
    }

    /* Buttons */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: -0.2px;
    }

    .btn:hover { filter: brightness(1.1); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { cursor: not-allowed; opacity: 0.4; filter: none; }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .btn-ghost {
      background: #161922;
      color: #9ca3af;
      border: 1px solid #2a2d3a;
    }

    .btn-ghost:hover { background: #1c1f2e; }

    .btn-danger-ghost {
      background: none;
      color: #6b7280;
      border: 1px solid #2a2d3a;
      font-size: 12px;
      padding: 6px 12px;
    }

    .btn-danger-ghost:hover {
      color: #ef4444;
      border-color: #3a2030;
    }

    /* Progress */
    .progress-text {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      padding: 4px 0;
      font-variant-numeric: tabular-nums;
    }

    /* Error */
    .error {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      background: #1e1520;
      border: 1px solid #3a2030;
      border-radius: 8px;
      font-size: 12px;
      color: #f87171;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">D</div>
    <h1>Demoframe</h1>
  </div>

  <div class="status-bar">
    <div id="status-dot" class="status-dot idle"></div>
    <span id="status-text" class="status-text">Ready to capture</span>
  </div>

  <input
    id="demo-name"
    class="demo-name-input"
    type="text"
    placeholder="Demo name (e.g., My CRM Demo)"
  />

  <div class="screens-list">
    <div class="screens-label">Captured Screens</div>
    <div id="screens-container">
      <div class="empty-state">No screens captured yet</div>
    </div>
  </div>

  <div class="controls">
    <button id="capture-btn" class="btn btn-primary">Capture This Screen</button>
    <button id="upload-btn" class="btn btn-success" disabled>Finish &amp; Upload</button>
  </div>

  <div id="progress" class="progress-text"></div>

  <div id="error" class="error"></div>

  <div class="footer">
    <button id="discard-btn" class="btn btn-danger-ghost" style="display: none">Discard All</button>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
